<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cẩm tú cầu xinh đẹp của em</title>

  <style>
    /* ==========================================
       1. KHU VỰC GIAO DIỆN (CSS) - HOA LÁ HẸ
       ========================================== */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Đổi hình nền hoa lá hẹ nghệ thuật, dịu mát */
      background-image: url('https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17?q=80&w=1920'); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #2c3e50; /* Màu chữ xanh đen đậm cho hài hòa với thiên nhiên */
    }

    /* Thanh Header trên cùng chứa ảnh đại diện */
    header {
      background-image: url('Screenshot 2026-05-22 230746.png'); 
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      padding: 60px 20px; /* Tăng độ rộng khung để lộ ảnh nền đẹp hơn */
      position: relative;
    }

    header img {
      width: 120px;
      height: 120px;
      border-radius: 50%; /* Bo tròn ảnh đại diện thành hình tròn */
      border: 4px solid #fff;
      margin-bottom: 10px;
    }

    /* Thanh menu điều hướng (Navigation Bar) */
    nav {
      background: rgba(52, 73, 94, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      color: #2ecc71; /* Di chuột vào chữ menu sẽ đổi sang màu xanh lá */
      text-decoration: underline;
    }

    /* Styling cho Dropdown Menu */
    nav .dropdown {
      position: relative;
      display: inline-block;
    }

    nav .dropdown-content {
      display: none;
      position: absolute;
      background-color: rgba(255, 255, 255, 0.98);
      min-width: 280px;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.15);
      border-radius: 10px;
      z-index: 1000;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      overflow: hidden;
      margin-top: 5px;
    }

    nav .dropdown-content a {
      color: #2c3e50;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 1px solid #f0f0f0;
      margin: 0;
      transition: background 0.2s, color 0.2s;
    }

    nav .dropdown-content a:last-child {
      border-bottom: none;
    }

    nav .dropdown-content a:hover {
      background-color: #27ae60;
      color: white;
      text-decoration: none;
    }

    /* Hiển thị danh sách khi di chuột vào */
    nav .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Phần thân trang web chứa lịch và nội dung */
    section.container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 20px;
    }

    /* Khung trắng sữa chứa nội dung bên trong, nhìn xuyên thấu nhẹ */
    .left, .right {
      flex: 1;
      min-width: 300px;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.9); /* Màu trắng sữa đổ bóng */
      padding: 25px;
      border-radius: 15px; /* Bo tròn góc khung */
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* Bóng đổ sang xịn mịn */
    }

    /* Thanh tiến độ học tập */
    .progress-bar {
      background: #e0e0e0;
      border-radius: 5px;
      height: 10px;
      margin-bottom: 15px;
    }

    .progress {
      background: #27ae60; /* Đổi thanh tiến độ sang màu xanh lá */
      height: 100%;
      border-radius: 5px;
    }

    /* Giao diện bộ Lịch Nhật Ký */
    #calendar {
      width: 100%;
      background: #fffbfa; /* Đổi màu nền lịch nhẹ nhàng */
      border-radius: 10px;
      padding: 15px;
      box-sizing: border-box;
    }

    #month-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    #month {
      font-weight: bold;
      font-size: 20px;
      color: #27ae60; /* Tiêu đề tháng màu xanh lá */
    }

    #weekdays, #dates {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    #weekdays div, #dates div {
      text-align: center;
      padding: 10px 0;
      font-weight: bold;
    }

    #weekdays div {
      color: #7f8c8d;
    }

    #dates div {
      cursor: pointer;
      border-radius: 50%;
      transition: 0.3s;
      margin: 2px;
    }

    #dates div:hover {
      background: #2ecc71;
      color: white;
    }

    /* Ngày nào có viết nhật ký/ghi chú */
    #dates div.has-note {
      background: #27ae60; /* Đổi thành màu xanh lá cây đậm */
      color: white;
    }

    /* Ô hiển thị ngày hôm nay */
    #dates div.today {
      background: #fff;
      color: #27ae60;
      border: 2px solid #27ae60;
    }

    /* Khung soạn thảo nhật ký */
    #note-box {
      background: #f9f9f9;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      border-left: 5px solid #27ae60;
    }

    textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: none;
    }

    /* Các nút bấm */
    button {
      background: #27ae60; /* Nút bấm màu xanh lá */
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 5px;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: #219150;
    }

    button.secondary {
      background: #95a5a6;
    }
    button.secondary:hover {
      background: #7f8c8d;
    }

    footer {
      text-align: center;
      background: rgba(44, 62, 80, 0.9);
      color: white;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://github.com/Shine9492/Shine9492.github.io/blob/main/Screenshot%202025-07-23%20221107.png?raw=true" alt="Ảnh đại diện">
    <h1>Chào anh, thân ái của em!</h1>
    <p>Em đã chờ anh từ năm 21 tuổi rồi ✨</p>
  </header>

  <nav>
    <a href="about.html">Giới thiệu</a>
    
    <!-- Dropdown Danh sách Fic -->
    <div class="dropdown">
      <a href="#reviewcosonganhne">Những vì sao trên trời cao ▾</a>
      <div class="dropdown-content">

    </div>

    <a href="#hoachdinhtuonglai">Tương lai</a>

  <section class="container">
    <div class="right">
      <h3>📅 Nhật Ký Của Shine</h3>
      <div id="calendar">
        <div id="month-container">
          <button id="prev">« Tháng trước</button>
          <div id="month"></div>
          <button id="next">Tháng sau »</button>
        </div>
        <div id="weekdays"></div>
        <div id="dates"></div>
      </div>

      <div id="note-box" style="display:none;">
        <h4>📝 Viết nhật ký ngày: <span id="note-date"></span></h4>
        <textarea id="note-text" rows="6" placeholder="Hôm nay của bạn thế nào? Ngồi xuống viết vài dòng nhé..."></textarea><br>
        <button onclick="saveNote()">Lưu nhật ký</button>
        <button class="secondary" onclick="document.getElementById('note-box').style.display='none'">Đóng lại</button>
      </div>
    </div>
  </section>

  <footer>
    &copy; Yêu anh thật nhiều
  </footer>

  <script>
    // Tạm thời vẫn lấy dữ liệu từ trình duyệt cũ (Lượt sau mình sẽ đổi đoạn này thành Database)
    const lNotes = JSON.parse(localStorage.getItem('notes') || '{}');

    // Hàm dựng giao diện lịch
    function renderCalendar(y, m) {
      document.getElementById('dates').innerHTML = '';
      document.getElementById('month').innerText = `Tháng ${m+1} - Năm ${y}`;
      const weekdays = ['CN','T2','T3','T4','T5','T6','T7'];
      document.getElementById('weekdays').innerHTML = weekdays.map(d=>`<div>${d}</div>`).join('');
      const start = new Date(y,m,1).getDay();
      const days = new Date(y,m+1,0).getDate();

      for(let i=0;i<start;i++)
        document.getElementById('dates').innerHTML += `<div></div>`;

      for(let d=1; d<=days; d++){
        const key = `${y}-${m+1}-${d}`;
        const noteClass = lNotes[key] ? 'has-note' : '';
        const today = new Date();
        const isToday = today.getDate() === d && today.getMonth() === m && today.getFullYear() === y;
        const className = `${noteClass} ${isToday ? 'today' : ''}`;
        document.getElementById('dates').innerHTML +=
          `<div class="${className}" onclick="openNote('${key}')">${d}</div>`;
      }
    }

    // Hàm mở ô viết ghi chú khi click vào 1 ngày trên lịch
    function openNote(key) {
      document.getElementById('note-box').style.display = 'block';
      document.getElementById('note-date').innerText = key;
      document.getElementById('note-text').value = lNotes[key] || '';
    }

    // Hàm bấm lưu nhật ký 
    function saveNote() {
      const key = document.getElementById('note-date').innerText;
      lNotes[key] = document.getElementById('note-text').value;
      localStorage.setItem('notes', JSON.stringify(lNotes));
      renderCalendar(...document.currentCalendar);
      alert("Đã lưu tạm vào máy này thành công! Sắp tới chúng ta sẽ lưu lên mạng luôn nha.");
    }

    // Tự động nhận diện ngày tháng năm hiện tại để vẽ lịch
    let today = new Date();
    document.currentCalendar = [today.getFullYear(), today.getMonth()];
    renderCalendar(...document.currentCalendar);

    // Xử lý sự kiện bấm chuyển tháng
    document.getElementById('prev').onclick = () => {
      let [y,m]=document.currentCalendar;
      m--; if(m<0){m=11; y--;}
      document.currentCalendar=[y,m];
      renderCalendar(y,m);
    }
    document.getElementById('next').onclick = () => {
      let [y,m]=document.currentCalendar;
      m++; if(m>11){m=0; y++;}
      document.currentCalendar=[y,m];
      renderCalendar(y,m);
    }
  </script>

</body>
